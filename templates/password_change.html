{% extends "base.html" %}
{% block content %}
<main class="main"><div class="container" style="max-width:620px">
    <h1 class="page-title">Parolni almashtirish</h1>
    <form method="post" class="form-section">{% csrf_token %}
        {% if form.non_field_errors %}<div class="form-error">{{ form.non_field_errors }}</div>{% endif %}
        {% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
            {% for error in field.errors %}<small class="form-error">{{ error }}</small>{% endfor %}{% endfor %}
        <button class="btn" type="submit">Parolni saqlash</button>
    </form>
</div></main>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<main class="auth-wrap">
    <section class="auth-card">
        <h1>Yangi parol o‘rnating</h1>
        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div style="color:#c62828;margin-bottom:14px">{{ form.non_field_errors }}</div>
            {% endif %}
            {{ form.as_p }}
            <button type="submit" class="btn" style="width:100%">Parolni yangilash</button>
        </form>
    </section>
</main>
{% endblock %}
